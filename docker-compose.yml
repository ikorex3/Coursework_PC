version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: coursework_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  server:
    build: .
    container_name: coursework_server
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
